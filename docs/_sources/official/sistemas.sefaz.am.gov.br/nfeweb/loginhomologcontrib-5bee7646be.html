	function mudaFoco(obj, evt) {
		if(evt.keyCode == 8) {
			return true;
		}
		
		var browser = document.all ? 1 : 1;
		if(obj.value.length + browser >= obj.maxLength) {
			var senhaAcesso = document.getElementById('senhaAcesso');
			senhaAcesso.focus();
			obj.value += String.fromCharCode(evt.keyCode || evt.which);
		}
		return true;
	}
