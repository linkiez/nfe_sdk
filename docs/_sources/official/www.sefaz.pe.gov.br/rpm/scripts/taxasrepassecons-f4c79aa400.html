<script language="JavaScript">
/***
*** Function ConsultarIndice
***/
function form_onsubmit(){
	var retorno = true;
	//ConsultarMuncAno
	
	frmConsulta.hdAno.value = frmConsulta.Ano.value;
	frmConsulta.hdIndiceAno.value = 0;
	
	if (document.frmConsulta.Ano.value == "") {	  
	  alert('Informe o Ano!');
	  retorno = false;
	}
	else {	
	  frmConsulta.hdIndiceAno.value = 1;
	  frmConsulta.action = 'TaxasRepasseCons.asp';
	}
	
	return retorno;
}

function ConsultarMuncAno(ano) {
    frmConsulta.hdAno.value = ano;
	frmConsulta.hdIndiceAno.value = 0;
	
    if (document.frmConsulta.Ano.value == "") {	  
      alert('Informe o Ano!');
    }
    else {	
	  frmConsulta.hdIndiceAno.value = 1;
	  frmConsulta.action = 'TaxasRepasseCons.asp';
	  frmConsulta.submit();  	  	
    }
}

function Consultar() {
  if (document.frmConsulta.cboIndiceMunc.value == "") {
    alert('Informe o Índice de Participação!'); 
  }
  else { 
    if (document.frmConsulta.Ano.value == "") {
      alert('Informe o Ano !');
    }
    else {	
	  document.frmConsulta.submit();	  	
    }
  }
}



/***
*** Function ConsultarIndice
***/
function ConsultarMuncAnoIndice(ano, indice) {
    frmConsulta.hdAno.value = ano;
	frmConsulta.hdIndice.value = indice;
	
    if (document.frmConsulta.Ano.value == "") {
      alert('Informe o Ano!');
    }
    else {	
	  frmConsulta.action = 'TaxasRepasse.asp';
	  frmConsulta.submit();  	  	
    }
}
</script>
