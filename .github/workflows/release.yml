name: Release

# Publishes @linkiez/nfe-sdk to GitHub Packages with semantic-release.
# Runs only on pushes to main (or manually); pull requests never publish.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      released_tag: ${{ steps.semantic.outputs.released_tag }}
      released_version: ${{ steps.semantic.outputs.released_version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install XML Schema validator
        run: sudo apt-get update && sudo apt-get install --yes libxml2-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@linkiez'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build gate
        run: npm run build

      - name: Lint gate
        run: npm run lint

      - name: Typecheck gate
        run: npm run typecheck

      - name: Test gate
        run: npm test

      - name: Package contract gate
        run: npm run validate:tarball

      - name: Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before="$(git tag --sort=-version:refname | sed -n '1p')"
          npx semantic-release
          after="$(git tag --sort=-version:refname | sed -n '1p')"
          if [ "$before" != "$after" ]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "released_tag=$after" >> "$GITHUB_OUTPUT"
            echo "released_version=${after#v}" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi

  # GitHub Packages (published by the Release job) is the registry the consumers use. The npmjs
  # mirror is optional: it is skipped without NPM_TOKEN.
  publish-npmjs:
    name: Mirror release to npmjs
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Setup Node.js for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@linkiez'

      - name: Pack the published GitHub package
        id: pack
        working-directory: ${{ runner.temp }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASED_VERSION: ${{ needs.release.outputs.released_version }}
        run: |
          tarball="$(npm pack "@linkiez/nfe-sdk@${RELEASED_VERSION}" --silent)"
          echo "path=${RUNNER_TEMP}/${tarball}" >> "$GITHUB_OUTPUT"

      - name: Setup npmjs registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check npmjs publishing token
        id: npm_token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::NPM_TOKEN is not configured: skipping the optional npmjs mirror (GitHub Packages already has the release)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Provenance is only accepted from public repositories (npm answers 422 for private ones).
      - name: Publish to npmjs
        if: steps.npm_token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.path }}
        # The packed manifest carries publishConfig.registry (GitHub Packages), which wins over the
        # --registry flag, so the unpacked manifest is pointed at npmjs before publishing.
        run: |
          mkdir -p "${RUNNER_TEMP}/mirror"
          tar -xzf "$TARBALL" -C "${RUNNER_TEMP}/mirror"
          cd "${RUNNER_TEMP}/mirror/package"
          npm pkg set publishConfig.registry=https://registry.npmjs.org
          npm publish --registry=https://registry.npmjs.org --access public --ignore-scripts
