name: CI

# Manual verification scenario for this workflow:
# 1. Open a pull request with an intentional typecheck regression.
# 2. Confirm the run fails in the "Typecheck gate" step before merge.
# 3. Push the fix and confirm the same workflow turns green without publishing artifacts.

on:
  pull_request:
  push:

jobs:
  release-hardening-gates:
    if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build gate
        run: npm run build

      - name: Lint gate
        run: npm run lint

      - name: Typecheck gate
        run: npm run typecheck

      - name: Test gate
        run: npm run test

      - name: Docs check gate
        run: npm run docs:check
